<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="30" height="30" x="1" y="1" rx="6" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.2"/>
  <!-- Boundary / cutting edge (vertical) -->
  <line x1="19" y1="4" x2="19" y2="28" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
  <!-- Extend line (green, extending to boundary) -->
  <line x1="4" y1="10" x2="11" y2="10" stroke="#0d6efd" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="11" y1="10" x2="19" y2="10" stroke="#198754" stroke-width="2.5" stroke-dasharray="2,2"/>
  <polygon points="17,8 19,10 17,12" fill="#198754"/>
  <!-- Trim line (blue kept, red dashed trimmed) -->
  <line x1="4" y1="22" x2="19" y2="22" stroke="#0d6efd" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="19" y1="22" x2="28" y2="22" stroke="#dc3545" stroke-width="2" stroke-dasharray="2,2" stroke-linecap="round"/>
  <!-- Small trim cut mark 'X' -->
  <line x1="22.5" y1="19.5" x2="25.5" y2="24.5" stroke="#dc3545" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="25.5" y1="19.5" x2="22.5" y2="24.5" stroke="#dc3545" stroke-width="1.5" stroke-linecap="round"/>
</svg>
