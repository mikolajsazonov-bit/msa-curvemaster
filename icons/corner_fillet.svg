<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="30" height="30" x="1" y="1" rx="6" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.2"/>
  <!-- Original sharp corner dashed -->
  <polyline points="6,6 26,6 26,26" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="2,2" fill="none"/>
  <!-- Fillet curve -->
  <path d="M 6,6 L 14,6 A 12,12 0 0,1 26,18 L 26,26" stroke="#0d6efd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Tangent points -->
  <circle cx="14" cy="6" r="2" fill="#fd7e14" stroke="#ffffff" stroke-width="1"/>
  <circle cx="26" cy="18" r="2" fill="#fd7e14" stroke="#ffffff" stroke-width="1"/>
  <!-- Fillet radius arc indicator -->
  <path d="M 14,18 L 22.5,9.5" stroke="#198754" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="14" cy="18" r="1.5" fill="#198754"/>
</svg>
